<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&family=Onest:wght@100..900&display=swap" rel="stylesheet" />
    <title>Stash</title>
    <!-- Theme (Mosaic DESIGN.md): applied before paint so there's no flash. The cookie is shared across *.akif.kr -->
    <script>
      const theme = document.cookie.match(/(?:^|; )theme=([\w-]+)/)?.[1];
      if (theme && theme !== "dakota-black") document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body class="bg-black font-sans text-neutral-200 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
